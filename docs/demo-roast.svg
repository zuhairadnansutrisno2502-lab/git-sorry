<svg width="820" height="372" viewBox="0 0 820 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="git-sorry roast example">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t { font-size: 15px; }
  </style>
  <rect width="820" height="372" rx="12" fill="#1a1b26"/>
  <rect width="820" height="40" rx="12" fill="#24283b"/>
  <rect y="28" width="820" height="12" fill="#24283b"/>
  <circle cx="26" cy="20" r="6" fill="#f7768e"/>
  <circle cx="48" cy="20" r="6" fill="#e0af68"/>
  <circle cx="70" cy="20" r="6" fill="#9ece6a"/>
  <text x="410" y="25" text-anchor="middle" class="mono" font-size="13" fill="#7f88b3">git-sorry blame</text>

  <text x="24" y="70" class="mono t">
    <tspan fill="#9ece6a">➜</tspan><tspan fill="#7dcfff">  ~/my-project </tspan><tspan fill="#c0caf5">git-sorry blame src/payments.ts 88</tspan>
  </text>
  <text x="24" y="95" class="mono t" fill="#565f89">Blamed Reza (2024-11-03). Time for a call-out.</text>
  <text x="24" y="120" class="mono t" fill="#565f89">Summoning Gemini...</text>

  <rect x="40" y="140" width="740" height="176" rx="8" fill="none" stroke="#f7768e" stroke-width="1.5"/>
  <rect x="60" y="132" width="160" height="16" fill="#1a1b26"/>
  <text x="68" y="145" class="mono" font-size="14" fill="#f7768e">🔥 A Formal Roast</text>

  <text x="64" y="176" class="mono t" fill="#c0caf5">Gather round, everyone. Reza blessed us with this</text>
  <text x="64" y="200" class="mono t" fill="#c0caf5">masterpiece back in November, and honestly, chef's kiss.</text>
  <text x="64" y="224" class="mono t" fill="#c0caf5">Nothing says confidence like shipping on a Friday and</text>
  <text x="64" y="248" class="mono t" fill="#c0caf5">logging straight off. I have a few questions. Actually,</text>
  <text x="64" y="272" class="mono t" fill="#c0caf5">I have many. Whenever you are ready, the floor, and</text>
  <text x="64" y="296" class="mono t" fill="#c0caf5">this bug, are all yours.</text>

  <text x="24" y="348" class="mono t" fill="#9ece6a">✓ Broadcast to your team.</text>
</svg>

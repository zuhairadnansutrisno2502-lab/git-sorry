<svg width="860" height="470" viewBox="0 0 860 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="git-sorry roast example: a terminal screenshot taped to the page, stamped DESERVED, with team reactions underneath">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .hand { font-family: 'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print',cursive; }
    .t { font-size: 14px; }
  </style>
  <rect width="860" height="470" rx="18" fill="url(#bg)"/>

  <!-- the taped-down terminal -->
  <g transform="translate(20,34) rotate(0.8 370 170)">
    <rect x="8" y="12" width="740" height="340" rx="12" fill="#0e0f16" opacity="0.55"/>
    <rect width="740" height="340" rx="12" fill="#16161e"/>
    <rect width="740" height="36" rx="12" fill="#24283b"/>
    <rect y="24" width="740" height="12" fill="#24283b"/>
    <circle cx="22" cy="18" r="6" fill="#f7768e"/>
    <circle cx="44" cy="18" r="6" fill="#e0af68"/>
    <circle cx="66" cy="18" r="6" fill="#9ece6a"/>
    <text x="370" y="23" text-anchor="middle" class="mono" font-size="12" fill="#7f88b3">git-sorry blame</text>

    <text x="24" y="64" class="mono t">
      <tspan fill="#9ece6a">&#10148;</tspan><tspan fill="#7dcfff">  ~/my-project </tspan><tspan fill="#c0caf5">git-sorry blame src/payments.ts 88</tspan>
    </text>
    <text x="24" y="88" class="mono t" fill="#565f89">Blamed Reza (2024-11-03). Time for a call-out.</text>
    <text x="24" y="110" class="mono t" fill="#565f89">Summoning Gemini...</text>

    <rect x="28" y="128" width="684" height="158" rx="8" fill="none" stroke="#f7768e" stroke-width="1.5"/>
    <rect x="46" y="120" width="152" height="16" fill="#16161e"/>
    <text x="54" y="133" class="mono" font-size="13" fill="#f7768e">&#128293; A Formal Roast</text>

    <text x="48" y="162" class="mono t" fill="#c0caf5">Gather round, everyone. Reza blessed us with this</text>
    <text x="48" y="184" class="mono t" fill="#c0caf5">masterpiece back in November, and honestly, chef's kiss.</text>
    <text x="48" y="206" class="mono t" fill="#c0caf5">Nothing says confidence like shipping on a Friday and</text>
    <text x="48" y="228" class="mono t" fill="#c0caf5">logging straight off. I have a few questions. Actually,</text>
    <text x="48" y="250" class="mono t" fill="#c0caf5">I have many. Whenever you are ready, the floor, and</text>
    <text x="48" y="272" class="mono t" fill="#c0caf5">this bug, are all yours.</text>

    <text x="24" y="318" class="mono t" fill="#9ece6a">&#10003; Broadcast to your team.</text>
  </g>

  <!-- tape holding the screenshot down -->
  <rect x="0" y="30" width="68" height="20" fill="#d9d0bd" opacity="0.5" transform="rotate(-40 34 40)"/>
  <rect x="714" y="30" width="68" height="20" fill="#d9d0bd" opacity="0.5" transform="rotate(40 748 40)"/>

  <!-- rubber stamp -->
  <g transform="rotate(-10 680 105)" opacity="0.9">
    <rect x="575" y="77" width="210" height="56" rx="8" fill="none" stroke="#9ece6a" stroke-width="4"/>
    <rect x="582" y="84" width="196" height="42" rx="5" fill="none" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="680" y="115" text-anchor="middle" class="hand" font-size="28" font-weight="700" fill="#9ece6a" letter-spacing="3">DESERVED</text>
  </g>

  <!-- scribbled note -->
  <text x="620" y="200" class="hand" font-size="16" fill="#e0af68" transform="rotate(-3 620 200)">not you = free content</text>
  <path d="M 600 208 C 555 204 510 180 475 140 M 475 140 L 475 150 M 475 140 L 484 142" fill="none" stroke="#e0af68" stroke-width="2" stroke-linecap="round"/>

  <!-- little flames by the roast box -->
  <path d="M 772 300 C 762 286 767 272 776 264 C 774 275 781 275 780 267 C 787 276 785 291 772 300 Z" fill="#e0af68"/>
  <path d="M 792 312 C 786 304 789 295 794 290 C 793 297 797 297 796 292 C 800 298 799 306 792 312 Z" fill="#f7768e"/>

  <!-- the team reacts -->
  <g class="hand">
    <rect x="56" y="396" width="88" height="34" rx="17" fill="#1f2335" stroke="#565f89" stroke-width="1.5" transform="rotate(1 100 413)"/>
    <text x="100" y="419" text-anchor="middle" font-size="15" fill="#c0caf5" transform="rotate(1 100 413)">&#128128; 23</text>
    <rect x="158" y="396" width="84" height="34" rx="17" fill="#1f2335" stroke="#565f89" stroke-width="1.5" transform="rotate(-1 200 413)"/>
    <text x="200" y="419" text-anchor="middle" font-size="15" fill="#c0caf5" transform="rotate(-1 200 413)">&#128293; 15</text>
    <rect x="256" y="396" width="80" height="34" rx="17" fill="#1f2335" stroke="#565f89" stroke-width="1.5" transform="rotate(1.4 296 413)"/>
    <text x="296" y="419" text-anchor="middle" font-size="15" fill="#c0caf5" transform="rotate(1.4 296 413)">&#127871; 7</text>
    <text x="376" y="422" font-size="15" fill="#7f88b3" transform="rotate(-1 376 422)">reza has been typing for 11 minutes . . .</text>
  </g>

  <!-- snitchy already forwarded it -->
  <text x="755" y="398" text-anchor="end" class="hand" font-size="13" fill="#7f88b3" transform="rotate(-1 755 398)">already forwarded.</text>
  <g>
    <ellipse cx="795" cy="421" rx="31" ry="25" fill="#f0e0c0" stroke="#11121a" stroke-width="2.5"/>
    <path d="M 765 414 C 766 400 780 392 795 392 C 812 392 824 401 825 414 C 820 406 812 405 808 409 C 802 401 790 401 786 408 C 778 403 770 406 765 414 Z" fill="#16161e" stroke="#11121a" stroke-width="2"/>
    <g transform="rotate(-12 782 390)">
      <path d="M 768 398 L 771 382 L 780 392 L 787 378 L 794 391 L 803 381 L 806 396 Q 787 401 768 398 Z" fill="#e0af68" stroke="#11121a" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <path d="M 776 416 Q 784 411 792 415" fill="none" stroke="#11121a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 800 414 Q 808 409 816 413" fill="none" stroke="#11121a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="780" cy="419" r="3" fill="#11121a"/>
    <circle cx="804" cy="417" r="3" fill="#11121a"/>
    <path d="M 784 432 C 792 437 804 436 810 430" fill="none" stroke="#11121a" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>

<svg width="820" height="240" viewBox="0 0 820 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="git-sorry banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7768e"/>
      <stop offset="0.5" stop-color="#e0af68"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
  </defs>
  <rect width="820" height="240" rx="18" fill="url(#bg)"/>
  <text x="60" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="58" font-weight="700" fill="url(#title)">git-sorry</text>
  <text x="62" y="152" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#c0caf5">Your git blame, now with feelings.</text>
  <text x="62" y="184" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#7f88b3">Confess a bad line, roast whoever wrote it, and let the whole team hear about it.</text>
  <text x="700" y="120" font-size="72" text-anchor="middle">🙏</text>
  <text x="762" y="150" font-size="52" text-anchor="middle">🔥</text>
</svg>
